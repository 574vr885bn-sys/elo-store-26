<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elo Store — Minha Conta</title><style>body{margin:0;background:#08090c;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:30px}.card{background:#111319;border:1px solid #252832;border-radius:18px;padding:22px;margin:14px 0}input,button,textarea{font:inherit;padding:11px;border-radius:9px;border:1px solid #303541;background:#0c0e12;color:#fff;width:100%;box-sizing:border-box}button{cursor:pointer;background:#fff;color:#08090c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#9299a5}.hidden{display:none}.item{padding:13px;border:1px solid #292e38;border-radius:12px;margin:9px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Minha Conta</h1><div id="auth"><div class="card"><h2>Entrar</h2><div class="grid"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"></div><br><button onclick="login()">Entrar</button><p id="err" class="muted"></p></div><div class="card"><h2>Criar conta</h2><div class="grid"><input id="name" placeholder="Nome"><input id="regEmail" placeholder="Email"><input id="regPass" type="password" placeholder="Password (8+ caracteres)"><input id="regDiscord" placeholder="Discord (opcional)"></div><br><button onclick="register()">Criar conta</button></div></div><div id="app" class="hidden"><div class="card"><h2 id="welcome"></h2><p>Pontos: <b id="points">0</b> · Nível: <b id="level">1</b></p><button onclick="logout()">Terminar sessão</button></div><div class="card"><h2>Perfil</h2><div class="grid"><input id="pname"><input id="pdiscord" placeholder="Discord"><input id="problox" placeholder="Roblox"></div><br><button onclick="saveProfile()">Guardar perfil</button></div><div class="card"><h2>Pedidos</h2><div id="orders"></div></div><div class="card"><h2>Histórico de pontos</h2><div id="ledger"></div></div><div class="card"><h2>Notificações</h2><div id="notifications"></div></div><div class="card"><h2>Suporte</h2><input id="subject" placeholder="Assunto"><br><br><textarea id="message" placeholder="Como podemos ajudar?"></textarea><br><br><button onclick="ticket()">Criar ticket</button><div id="tickets"></div></div></div></main><script>let token=localStorage.getItem('eloCustomer');const $=x=>document.querySelector(x);async function api(u,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}async function login(){try{const d=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#pass').value})});token=d.token;localStorage.setItem('eloCustomer',token);load()}catch(e){$('#err').textContent=e.message}}async function register(){try{const d=await api('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#name').value,email:$('#regEmail').value,password:$('#regPass').value,discord:$('#regDiscord').value})});token=d.token;localStorage.setItem('eloCustomer',token);load()}catch(e){alert(e.message)}}async function load(){try{const [m,p,o,n,t]=await Promise.all([api('/api/auth/me'),api('/api/account/points'),api('/api/account/orders'),api('/api/account/notifications'),api('/api/account/tickets')]);$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#welcome').textContent='Olá, '+m.customer.name;$('#points').textContent=p.points;$('#level').textContent=p.level;$('#pname').value=m.customer.name;$('#pdiscord').value=m.customer.discord;$('#problox').value=m.customer.roblox;$('#orders').innerHTML=o.length?o.map(x=>`<div class=item><b>${x.order_number}</b> — ${x.product_name}<br>${x.status} · € ${Number(x.total).toFixed(2)}</div>`).join(''):'<p class=muted>Ainda não tens pedidos associados.</p>';$('#ledger').innerHTML=p.ledger.map(x=>`<div class=item>${x.amount>0?'+':''}${x.amount} pontos — ${x.reason}</div>`).join('')||'<p class=muted>Sem movimentos.</p>';$('#notifications').innerHTML=n.map(x=>`<div class=item><b>${x.title}</b><br>${x.message}</div>`).join('')||'<p class=muted>Sem notificações.</p>';$('#tickets').innerHTML=t.map(x=>`<div class=item><b>${x.ticket_number}</b> — ${x.status}<br>${x.subject}</div>`).join('')||''}catch{localStorage.removeItem('eloCustomer');token=null}}async function saveProfile(){try{await api('/api/auth/me',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#pname').value,discord:$('#pdiscord').value,roblox:$('#problox').value})});alert('Perfil guardado.');load()}catch(e){alert(e.message)}}async function ticket(){try{await api('/api/account/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:$('#subject').value,message:$('#message').value})});$('#subject').value='';$('#message').value='';alert('Ticket criado.');load()}catch(e){alert(e.message)}}async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('eloCustomer');location.reload()}if(token)load()</script></body></html>
