<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elo Store — Admin Pro</title><style>body{margin:0;background:#08090c;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px}.card{background:#111319;border:1px solid #252832;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:16px;background:#151821;border-radius:14px}.stat b{display:block;font-size:25px;margin-top:8px}input,button,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #303541;background:#0c0e12;color:#fff}button{cursor:pointer;background:#fff;color:#08090c}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.hidden{display:none}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:10px;border-bottom:1px solid #292e38}.muted{color:#9299a5}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.table{min-width:850px}.scroll{overflow:auto}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div id="login" class="card"><h1>Admin Pro</h1><p class="muted">Usa a mesma chave definida em <code>ADMIN_PANEL_KEY</code> no Railway. Se não estiver definida, usa a tua ADMIN_PASSWORD.</p><input id="key" type="password" placeholder="Chave de administrador"><br><br><button onclick="enter()">Entrar</button><p id="err"></p></div><div id="app" class="hidden"><div class="row"><h1>Elo Store — Admin Pro</h1><button onclick="location.reload()">↻ Atualizar</button></div><div class="grid"><div class="stat">Clientes<b id="customers">0</b></div><div class="stat">Tickets abertos<b id="tickets">0</b></div><div class="stat">Notificações<b id="unread">0</b></div><div class="stat">Pontos em circulação<b id="points">0</b></div><div class="stat">Pedidos hoje<b id="today">0</b></div></div><div class="card"><h2>Clientes</h2><div class="scroll"><table class="table"><thead><tr><th>Cliente</th><th>Email</th><th>Discord</th><th>Pontos</th><th>Nível</th><th>Estado</th><th>Ação</th></tr></thead><tbody id="clients"></tbody></table></div></div><div class="card"><h2>Tickets</h2><div id="ticketList"></div></div><div class="card"><h2>Auditoria</h2><div id="audit"></div></div></div></main><script>let key=localStorage.getItem('eloAdminPro')||'';const $=x=>document.querySelector(x);async function api(u,o={}){o.headers={...(o.headers||{}),...(key?{'x-admin-key':key}:{})};const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}async function enter(){key=$('#key').value;try{await api('/api/admin/overview');localStorage.setItem('eloAdminPro',key);start()}catch(e){$('#err').textContent=e.message}}async function start(){try{const [v,c,t,a]=await Promise.all([api('/api/admin/overview'),api('/api/admin/customers'),api('/api/admin/tickets'),api('/api/admin/audit')]);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#customers').textContent=v.customers;$('#tickets').textContent=v.openTickets;$('#unread').textContent=v.unread;$('#points').textContent=v.points;$('#today').textContent=v.today;$('#clients').innerHTML=c.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.discord)}</td><td>${x.points}</td><td>${x.level}</td><td>${x.active?'Ativo':'Bloqueado'}</td><td><button onclick="points(${x.id})">+/- pontos</button></td></tr>`).join('');$('#ticketList').innerHTML=t.map(x=>`<div class=card><b>${x.ticket_number}</b> — ${esc(x.subject)}<br><span class=muted>${esc(x.customer_name||'Cliente')} · ${esc(x.customer_email||'')}</span><p>${esc(x.message)}</p><select onchange="status(${x.id},this.value)"><option ${x.status==='Aberto'?'selected':''}>Aberto</option><option ${x.status==='Em análise'?'selected':''}>Em análise</option><option ${x.status==='Respondido'?'selected':''}>Respondido</option><option ${x.status==='Fechado'?'selected':''}>Fechado</option></select></div>`).join('')||'<p class=muted>Sem tickets.</p>';$('#audit').innerHTML=a.map(x=>`<div>${esc(x.created_at)} — <b>${esc(x.action)}</b> — ${esc(x.target)} — ${esc(x.details)}</div>`).join('')||'<p class=muted>Sem registos.</p>'}catch(e){localStorage.removeItem('eloAdminPro');key='';$('#login').classList.remove('hidden');$('#app').classList.add('hidden');$('#err').textContent=e.message}}async function points(id){const n=prompt('Quantidade de pontos (ex.: 50 ou -20):');if(n===null)return;try{await api('/api/admin/customers/'+id+'/points',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:Number(n),reason:'Ajuste manual'})});start()}catch(e){alert(e.message)}}async function status(id,s){try{await api('/api/admin/tickets/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});start()}catch(e){alert(e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if(key)start()</script></body></html>
