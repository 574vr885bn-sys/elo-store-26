<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elo Store — Administração</title><link rel="icon" href="/favicon.svg"><style>
body{margin:0;background:#09090b;color:#fff;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}.wrap{width:min(1200px,94%);margin:auto}.top{padding:25px 0;border-bottom:1px solid #222}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.card,.panel{background:#121216;border:1px solid #29292f;border-radius:14px;padding:18px}.card b{font-size:28px}.muted{color:#999}.login{width:min(400px,92%);margin:100px auto}.hidden{display:none}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px;border-bottom:1px solid #28282e;text-align:left;vertical-align:top}.table select,.input{background:#0b0b0e;color:#fff;border:1px solid #333;padding:8px;border-radius:8px}.btn{background:#fff;color:#09090b;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.danger{background:#2a1717;color:#fff}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{background:#17171b;color:#aaa;border:1px solid #29292f;padding:10px;border-radius:8px}.tabs button.active{background:#fff;color:#000}.product-row{display:grid;grid-template-columns:2fr 1fr 1fr 100px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #29292f}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.table{font-size:11px}.product-row{grid-template-columns:1fr 1fr}}
</style></head><body><div id="login" class="login card"><h1>Elo Store</h1><p class="muted">Painel de administração</p><input id="u" class="input" style="width:100%;margin:6px 0" placeholder="Utilizador"><input id="p" class="input" style="width:100%;margin:6px 0" type="password" placeholder="Password"><button class="btn" style="width:100%;margin-top:8px" onclick="login()">Entrar</button><p id="err" class="muted"></p></div>
<div id="app" class="hidden"><div class="top"><div class="wrap" style="display:flex;justify-content:space-between"><b>ELO STORE · ADMIN</b><button class="btn danger" onclick="logout()">Sair</button></div></div><main class="wrap"><div class="grid"><div class="card"><span class="muted">Pedidos</span><br><b id="sTotal">0</b></div><div class="card"><span class="muted">Pendentes</span><br><b id="sPending">0</b></div><div class="card"><span class="muted">Em processamento</span><br><b id="sProcessing">0</b></div><div class="card"><span class="muted">Receita</span><br><b id="sRevenue">R$ 0,00</b></div></div>
<div class="tabs"><button id="tOrders" class="active" onclick="showTab('orders')">Pedidos</button><button id="tProducts" onclick="showTab('products')">Produtos / Stock</button></div>
<section id="orders" class="panel"><h2>Pedidos</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Produto</th><th>Total</th><th>Estado</th><th>Data</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>
<section id="products" class="panel hidden"><h2>Produtos</h2><div id="productsList"></div></section></main></div>
<script>
let token=localStorage.getItem("eloAdmin");
const $=s=>document.querySelector(s);
const money=n=>"R$ "+Number(n).toFixed(2).replace(".",",");
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:"Bearer "+token};const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||"Erro");return d}
async function login(){try{const d=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("#u").value,password:$("#p").value})}).then(r=>r.json());if(!d.token)throw Error(d.error);token=d.token;localStorage.setItem("eloAdmin",token);start()}catch(e){$("#err").textContent=e.message}}
async function start(){try{await api("/api/admin/stats");$("#login").classList.add("hidden");$("#app").classList.remove("hidden");load()}catch{logout()}}
function logout(){localStorage.removeItem("eloAdmin");location.reload()}
async function load(){const [s,o,p]=await Promise.all([api("/api/admin/stats"),api("/api/admin/orders"),api("/api/admin/products")]);$("#sTotal").textContent=s.total;$("#sPending").textContent=s.pending;$("#sProcessing").textContent=s.processing;$("#sRevenue").textContent=money(s.revenue);$("#ordersBody").innerHTML=o.map(x=>`<tr><td><b>${x.order_number}</b><br><span class="muted">${x.discord}</span></td><td>${x.customer_name}<br>${x.roblox}</td><td>${x.product_name} ×${x.quantity}</td><td>${money(x.total)}</td><td><select class="input" onchange="setStatus(${x.id},this.value)">${["Pendente","Pago","Em processamento","Entregue"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></td><td>${new Date(x.created_at.replace(" ","T")).toLocaleString("pt-PT")}</td></tr>`).join("");$("#productsList").innerHTML=p.map(x=>`<div class="product-row"><b>${x.name}</b><input class="input" id="price${x.id}" type="number" step="0.01" value="${x.price}"><input class="input" id="stock${x.id}" type="number" value="${x.stock}"><button class="btn" onclick="saveProduct(${x.id})">Guardar</button></div>`).join("")}
async function setStatus(id,status){try{await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}
async function saveProduct(id){try{await api("/api/admin/products/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({price:Number($("#price"+id).value),stock:Number($("#stock"+id).value)})});alert("Guardado");load()}catch(e){alert(e.message)}}
function showTab(t){$("#orders").classList.toggle("hidden",t!=="orders");$("#products").classList.toggle("hidden",t!=="products");$("#tOrders").classList.toggle("active",t==="orders");$("#tProducts").classList.toggle("active",t==="products")}
if(token)start();
</script></body></html>
